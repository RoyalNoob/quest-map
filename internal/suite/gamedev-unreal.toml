# Built-in suite: game development with Unreal Engine (spec §4.3).
# A file suites/gamedev-unreal.toml in the board folder extends it: keys it sets win.
# Top-level keys must come before the first [table].

title = "Game development (Unreal Engine)"
disciplines = ["code", "blueprint", "design", "level", "art", "anim", "vfx", "audio", "ui", "qa"]
release_targets = ["Win64", "Linux", "Android", "IOS"]
release_id_format = "b<YYYY-MM-DD>.<n>"

[words]
release = "build"
releases = "builds"
target = "platform"
item = "asset"
feedback = "playtest note"
discipline = "discipline"

[[pipelines]]
name = "prop"
steps = ["blockout", "model", "texture", "import", "material", "in-engine"]

[[pipelines]]
name = "character"
steps = ["concept", "model", "texture", "rig", "anim", "import", "in-engine"]

[[pipelines]]
name = "level"
steps = ["blockout", "layout", "art-pass", "lighting", "polish"]

[[pipelines]]
name = "vfx"
steps = ["concept", "niagara", "in-engine"]

[intake]
status = "backlog"
doer = "person"
discipline = "qa"
labels = ["playtest"]

[adapters]
assets = "unreal"
locks = ["git-lfs", "lore"]
vcs = ["lore"]

# Custom fields: extra front-matter keys the UI shows and edits and the filter understands (platform:ps5).
# Fields: key (lowercase letters and _), label, type (text or choice), values (for a choice), help.

[[fields]]
key = "platform"
label = "Platform"
type = "choice"
values = ["Win64", "Linux", "Android", "IOS"]

[[fields]]
key = "ue_map"
label = "Unreal map"
help = "/Game/Maps/L_Bridge"

# When the UI shows a task field: field key -> terms (label:, discipline:, doer:, status:, priority: or a custom
# field key, "-" negates), any of which shows it. A field not listed always shows; a field with a value always
# shows; hidden ones are under "More fields". A board file that sets [show] replaces the whole table.
[show]
found_in = ["label:bug", "label:crash", "label:playtest", "discipline:qa"]
fixed_in = ["label:bug", "label:crash", "label:playtest", "discipline:qa"]
asset = ["discipline:art", "discipline:anim", "discipline:vfx", "discipline:level", "label:asset"]
pipeline = ["discipline:art", "discipline:anim", "discipline:vfx", "discipline:level", "label:asset"]

# Task templates, offered in the web UI's New task dialog and by task_new's template argument. Fields: name,
# title (a title start for the UI), body, status (backlog, todo), doer, priority, discipline, labels, pipeline.
# A template fills the fields a new task leaves empty; its labels are added.

[[templates]]
name = "Bug"
title = "Bug: "
labels = ["bug"]
body = """
## Steps to reproduce
1.

## Expected

## Actual

## Build and platform
- Build:
- Platform:
"""

[[templates]]
name = "Crash"
title = "Crash: "
priority = "high"
labels = ["bug", "crash"]
body = """
## What happened

## Steps to reproduce
1.

## Build and platform
- Build:
- Platform:

## Callstack / log
```
```
"""

[[templates]]
name = "Performance"
title = "Perf: "
discipline = "code"
labels = ["perf"]
body = """
## Where
- Map / scene:
- Platform:

## Measured
- Frame time (stat unit):
- Budget:

## Steps to reproduce
1.
"""

[[templates]]
name = "Prop asset"
title = "Prop: "
discipline = "art"
pipeline = "prop"
labels = ["asset"]
body = """
## Reference

## Budget
- Triangles:
- Texture size / texel density:

## Unreal
- Content path: /Game/Props/
- Collision:
"""

[[templates]]
name = "Character asset"
title = "Character: "
discipline = "art"
pipeline = "character"
labels = ["asset"]
body = """
## Concept / reference

## Budget
- Triangles:
- Bones:
- Texture sets:

## Animations needed
-
"""

[[templates]]
name = "Level"
title = "Level: "
discipline = "level"
pipeline = "level"
body = """
## Goal of the space

## Gameplay beats
-

## Unreal
- Map: /Game/Maps/
"""

# Saved views, offered in the web UI's view picker. Fields: name, filter (the search box language),
# lanes ("", discipline, milestone), sort ("", priority, updated, created, title), fields (card fields:
# priority claim steps doer discipline milestone labels spent found; empty = default), layout (board, table).

[[views]]
name = "Triage"
filter = "status:backlog"
lanes = "discipline"
sort = "priority"

[[views]]
name = "Playtest notes"
filter = "label:playtest -status:done"
sort = "created"
fields = ["priority", "discipline", "found"]

[[views]]
name = "Agents at work"
filter = "doer:agent -status:done"
sort = "updated"
fields = ["claim", "steps", "discipline", "spent"]

[[views]]
name = "Blocked"
filter = "blocked:yes"
lanes = "discipline"
sort = "priority"

[[views]]
name = "By milestone"
lanes = "milestone"
sort = "priority"

